name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate tag
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          PACKAGE_VERSION=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "led-service2") | .version')
          test "$VERSION" = "v$PACKAGE_VERSION"
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: led-release-${{ github.sha }}
          path: dist
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          cd dist
          sha256sum --check checksums.txt
          options=()
          if [[ "$VERSION" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$VERSION" ./*.tar.gz checksums.txt \
            --verify-tag --generate-notes --title "$VERSION" "${options[@]}"
