name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate Ansible deployment
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
        run: |
          python3 -m unittest discover -s ansible/tests -p 'test_*.py'
          pipx run ansible-lint ansible/
          pipx run --spec ansible-core ansible-playbook -i localhost, ansible/tests/archive.yaml
          pipx run --spec ansible-core ansible-playbook -i localhost, ansible/tests/state.yaml
          pipx run --spec ansible-core ansible-playbook -i localhost, ansible/tests/install.yaml -e ansible_become=true

  emulator:
    name: Lint and test (emulator)
    # The emulator backend targets macOS development, where minifb owns the
    # main thread and audio goes through rodio.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install protoc
        run: brew install protobuf

      - name: Clippy
        run: cargo clippy --locked --all-targets --no-default-features --features emulator -- -D warnings

      - name: Test
        run: cargo test --locked --no-default-features --features emulator

  rpi:
    name: Lint and build (rpi)
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config protobuf-compiler libasound2-dev

      - name: Clippy
        run: cargo clippy --locked --all-targets --no-default-features --features rpi -- -D warnings

      - name: Build
        run: cargo build --locked --bin led-server --no-default-features --features rpi

      - name: Test
        run: cargo test --locked --no-default-features --features rpi

  package:
    uses: ./.github/workflows/build-rpi.yml
